name: DSP CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dsp-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  macos:
    name: macOS Node and Bun runtime
    if: >-
      github.repository == 'xiehaibin18/deepseek-harness'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.3'
      - uses: pnpm/action-setup@v5.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime artifacts and check TypeScript
        run: pnpm run build --serial

      # Node-only coverage cannot instrument the forked Bun child. Exercise the
      # real transport, confinement, built workflow, and Bun Host recomposition
      # with both runtimes.
      - name: Verify runtime parity
        run: |
          export DSH_TEST_BUN_EXECUTABLE="$(command -v bun)"
          test -x "$DSH_TEST_BUN_EXECUTABLE"
          test -x /usr/bin/sandbox-exec
          test -s packages/ptc-runtime/ptc-runtime-node/lib/index.js
          test -s packages/ptc-runtime/ptc-runtime-node/lib/process.js
          test -s packages/workflow/workflow-ptc/lib/index.js
          test -s packages/boot/hmr/lib/index.js
          test -s packages/boot/app-boot/lib/index.js

          pnpm exec vitest run --maxWorkers=2 \
            packages/subprocess/subprocess/tests/control.spec.ts \
            packages/subprocess/subprocess/tests/control-bun.spec.ts \
            packages/ptc-runtime/ptc-runtime-node/tests/persistent-sandbox.spec.ts \
            packages/boot/app-boot/tests/package-meta.spec.ts \
            packages/boot/hmr/tests/profile.spec.ts
          pnpm run test:e2e --maxWorkers=1 \
            packages/ptc-runtime/ptc-runtime-node/tests/built-bun.e2e.ts \
            packages/workflow/workflow-ptc/tests/built-runtime.e2e.ts \
            packages/boot/hmr/tests/built-bun.e2e.ts
