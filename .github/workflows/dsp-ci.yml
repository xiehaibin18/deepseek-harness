name: DSP CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dsp-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.repository == 'xiehaibin18/deepseek-harness' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.plan.outputs.scopes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.3'
      - run: node --test .github/dsp-ci/scope.test.mjs
      - id: plan
        run: node .github/dsp-ci/scope.mjs

  macos:
    name: macOS Node and Bun runtime
    needs: changes
    if: needs.changes.outputs.scopes != ''
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DSH_TELEMETRY_DISABLED: '1'
      SCOPES: ${{ needs.changes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.3'
      - uses: pnpm/action-setup@v5.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and type-check selected workspaces
        run: bun .github/dsp-ci/build.mjs "$SCOPES"
      - name: Test PTC on Node and Bun
        if: contains(needs.changes.outputs.scopes, 'ptc')
        run: bash .github/dsp-ci/test.sh ptc
      - name: Test built Web startup and profile reload
        if: contains(needs.changes.outputs.scopes, 'web')
        run: bash .github/dsp-ci/test.sh web
