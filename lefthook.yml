# Git hooks (lefthook). Keep these local checkpoints fast; CI owns the full
# repository-wide gate matrix.
# Install: `node scripts/install-lefthook.mjs` (runs automatically via postinstall).

pre-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: >-
        sh -c 'if command -v bun >/dev/null 2>&1; then exec bun "$@"; else exec node_modules/.bin/tsx "$@"; fi' sh
        scripts/verify-translation-pairing.ts --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: >-
        sh -c 'if command -v bun >/dev/null 2>&1; then exec bun "$@"; else exec node_modules/.bin/tsx "$@"; fi' sh
        scripts/verify-archived-agent-notes.ts

    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      exclude:
        - 'vendor/*/src/**'
      run: >-
        sh -c 'if command -v bun >/dev/null 2>&1; then exec bun "$@"; else exec node_modules/.bin/tsx "$@"; fi' sh
        scripts/run-oxlint.ts --config .oxlintrc.staged.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: whitespace (staged)
      run: git diff --cached --check

    - name: pi-ai provider metadata
      glob: '{pnpm-lock.yaml,bun.lock,packages/llm/llm-pi-ai/package.json,packages/llm/llm-pi-ai/scripts/gen-provider-data.ts,packages/llm/llm-pi-ai/src/provider-data.generated.ts}'
      run: >-
        sh -c 'if command -v bun >/dev/null 2>&1; then exec bun "$@"; else exec node_modules/.bin/tsx "$@"; fi' sh
        packages/llm/llm-pi-ai/scripts/gen-provider-data.ts --check --cached

    - name: vendor manifest guard
      run: scripts/check-vendor-manifest.sh

pre-merge-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: >-
        sh -c 'if command -v bun >/dev/null 2>&1; then exec bun "$@"; else exec node_modules/.bin/tsx "$@"; fi' sh
        scripts/verify-translation-pairing.ts --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: >-
        sh -c 'if command -v bun >/dev/null 2>&1; then exec bun "$@"; else exec node_modules/.bin/tsx "$@"; fi' sh
        scripts/verify-archived-agent-notes.ts

pre-push:
  jobs:
    - name: typecheck
      run: sh -c 'if command -v bun >/dev/null 2>&1; then exec bun run typecheck; else exec pnpm run typecheck; fi'
